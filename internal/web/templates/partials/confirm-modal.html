{{ define "confirm-modal" }}

<div id="confirm-modal" class="modal" hidden>
  <div class="modal-content confirm-modal-content" role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title">
    <button type="button" class="close-modal" data-confirm-cancel aria-label="Close">
      &times;
    </button>
    <h2 id="confirm-modal-title">Confirm action</h2>
    <p class="confirm-modal-message" data-confirm-message></p>
    <div class="confirm-modal-actions">
      <button type="button" class="confirm-cancel-button" data-confirm-cancel>
        Cancel
      </button>
      <button type="button" class="confirm-submit-button" data-confirm-submit>
        Confirm
      </button>
    </div>
  </div>
</div>

{{ end }}
