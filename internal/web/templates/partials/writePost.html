{{ define "writePost-modal" }}

<div id="writePost-modal" class="modal">
    <div class="modal-content">

        <a href="#close" class="close-modal" aria-label="Close">&times;</a>

        <h2>Start a Discussion</h2>

        <form method="POST" action="/writePosts" enctype="multipart/form-data">

            <div class="form-group">
                <label for="writePost-title">TITLE</label>
                <input
                    id="writePost-title"
                    type="text"
                    name="title"
                    placeholder="What's on your literary mind?"
                    required
                >
            </div>

            <div class="form-group">
                <label for="writePost-category">CATEGORY</label>
                <select id="writePost-category" name="category_id" required>
                    <option value="" disabled selected>Choose a category</option>
                    {{ range .Categories }}
                        <option value="{{ .ID }}">{{ .Name }}</option>
                    {{ end }}
                </select>
            </div>

            <div class="form-group">
                <label for="writePost-content">CONTENT</label>
                <textarea
                    id="writePost-content"
                    name="content"
                    rows="8"
                    placeholder="Share your thoughts, interpretations, recommendations... Use *asterisks* for italics."
                    required
                ></textarea>
            </div>

            <div class="form-group">
                <label>COVER IMAGE (optional)</label>

                <div class="source-tabs">
                    <input type="radio" name="image_source" id="image-source-url" class="source-radio" checked>
                    <label for="image-source-url" class="source-tab">🔗 Image URL</label>
                    <input type="radio" name="image_source" id="image-source-file" class="source-radio">
                    <label for="image-source-file" class="source-tab">Upload File</label>
                </div>

                <input type="url"  name="image_url" class="source-panel source-panel-url" placeholder="https://...">
                <input type="file" name="picture" class="source-panel source-panel-file" accept="image/*">
            </div>

            <div class="modal-actions">
                <a href="#close" class="btn-secondary">Cancel</a>
                <button type="submit" class="login-button">publish review</button>
            </div>

        </form>
    </div>
</div>

{{ end }}
