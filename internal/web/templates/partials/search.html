{{ define "search"}}

<div class="search-box">
  <span class="search-icon"></span>
  <form method="GET" action="/" role="search">
    <input
      type="search"
      name="query"
      class="search-input"
      placeholder="search..."
      aria-label="Search posts"
      value="{{ .SearchQuery }}"
    />
    <button
      type="button"
      class="search-clear"
      aria-label="Clear search"
      title="Clear search"
      {{ if .SearchQuery }}data-active-search{{ end }}
    ></button>
  </form>
</div>

{{ end}}
