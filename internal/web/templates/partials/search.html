{{ define "search"}}

<div class="search-box">
  <span class="search-icon"></span>
  <form method="GET" action="/" role="search">
    <input
      type="search"
      name="query"
      class="search-input"
      placeholder="search..."
      aria-label="Search posts"
      value="{{ .SearchQuery }}"
    />
  </form>
  {{ if .SearchQuery }}
  <a class="search-clear" href="/" aria-label="Clear search" title="Clear search"></a>
  {{ end }}
</div>

{{ end}}
