{{ define "sidebar" }}
<aside class="carousel-scene">
    <span class="sidebar-label">Categories</span>
    <nav class="carousel-3d"id="carousel">
        <a href="/" class="category-link category-all">All Categories</a>
                {{ range .Categories}}
                <a href = "/?category_id={{ .ID }}"  class = "carousel-cell">{{ .Name}}</a>
                {{end}}
    </nav>
</aside>
{{ end }}
