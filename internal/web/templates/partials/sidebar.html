{{ define "sidebar" }}
<aside class="sidebar">
    <span class="sidebar-label">Categories</span>
    <nav class="category-list">
        <a href="/" class="category-link">All Categories</a>
        {{ range .Categories }}
        <a href="/?category_id={{ .ID }}" class="category-link">{{ .Name }}</a>
        {{ end }}
    </nav>
</aside>
{{ end }}
