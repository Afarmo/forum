{{ define "home-content" }}

<div >
    <div class="discussion-header">
        <div>
            <h3>All Discussions</h3>
            <p>Explore the latest thoughts from the Literary Lions community.</p>
        </div>
    
        <div>
                <button type="button" class="nav-button" onclick="openModal('writePost-modal')">Write Post</button>
        </div>
    </div>
   
    
    <div id="post-feed">
        {{ range .Posts }}
        <article class="post-card">
            <h3 class="post-title">{{ .Title }}</h3>
            {{ if .PictureContent }}
            <img class="post-image" src="/static/img/post/{{ .PictureContent }}" alt="{{ .Title }}">
            {{ end }}
            <p class="post-content">{{ .Content }}</p>
            <time class="post-date">{{ .CreatedAt.Format "Jan 2, 2006 3:04 PM" }}</time>
        </article>
        {{ end }}
    </div>

</div>

{{ template "writePost-modal" . }}
{{ end }}
