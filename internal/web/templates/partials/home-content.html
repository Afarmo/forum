{{ define "home-content" }}

<div>
  <div class="discussion-header">
    <div>
      <h3>All Discussions</h3>
      <p>Explore the latest thoughts from the Literary Lions community.</p>
    </div>

    <div>
      {{if .User}}
      <a class="nav-button" href="#writePost-modal">Write Post</a>
      {{end}}
    </div>
  </div>

  <div id="post-feed">
    {{ range .Posts }}
    {{ template "post-card" . }}
    {{ end }}
  </div>
  <p id="post-feed-empty" role="status" {{ if .Posts }}hidden{{ end }}>
    No Post Found.
  </p>
</div>

{{ template "writePost-modal" . }} {{ end }}
