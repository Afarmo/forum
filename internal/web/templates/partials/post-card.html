{{ define "post-card" }}

<article class="post-card" id="post-{{ .PostID }}">
  {{ if .PictureContent }}
  <a class="post-image-link" href="/posts/{{ .PostID }}" tabindex="-1" aria-hidden="true">
    <img class="post-image" src="{{ .ImageSrc }}" alt="" />
  </a>
  {{ end }}
  
    <div class="post-card-body">
      {{ if .CategoryNames }}
      <div class="post-categories">
        <span class="post-category">{{ .CategoryNames }}</span>
      </div>
      {{ end }}
      <details class="post-options">
    <summary class="post-options-toggle" aria-label="Post options">
      <span class="post-options-dot"></span>
      <span class="post-options-dot"></span>
      <span class="post-options-dot"></span>
    </summary>
    <div class="post-options-menu post-options-menu--row" role="menu">
      <button type="button" class="post-options-item post-options-item--icon comment-delete-button"
              role="menuitem" aria-label="Edit post" title="Edit post"
              onclick="openModal('edit-post-modal-{{ .PostID }}')">
        <svg class="comment-delete-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 20h9" />
          <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
        </svg>
      </button>
      <form method="POST" action="/posts/{{ .PostID }}/delete" data-confirm="Are you sure you want to delete this post?">
        <button type="submit" class="post-options-item post-options-item--icon comment-delete-button"
                role="menuitem" aria-label="Delete post" title="Delete post">
          <svg class="comment-delete-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 6h18" />
            <path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2" />
            <path d="M19 6l-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6" />
            <path d="M10 11v6M14 11v6" />
          </svg>
        </button>
      </form>
    </div>
    </details>
    <a class="post-link" href="/posts/{{ .PostID }}">
      <h3 class="post-title">{{ .Title }}</h3>
      <p class="post-content">{{ .Preview }}</p>
    </div>
  </a>
  <div class="post-card-footer">
    <a class="post-link" href="/users/{{ .UserID }}">
      <div class="post-author">
        {{ if .AuthorPicture }}
        <img class="post-author-avatar" src="{{ .AuthorPicture }}" alt="" />
        {{ else }}
        <span class="post-author-avatar post-author-avatar-empty" aria-hidden="true">✦</span>
        {{ end }}
        <span class="post-author-name">{{ .AuthorName }}</span>
        <span class="post-meta-separator" aria-hidden="true">·</span>
        <time class="post-date" datetime="{{ .CreatedAt.Format "2006-01-02T15:04:05Z07:00" }}">{{ .TimeAgo }}</time>
      </div>
    </a>
    <div class="post-card-actions">
      <button type="button" class="post-card-action reaction-button like-button{{ if eq .UserReaction 1 }} liked{{ end }}" data-post-id="{{ .PostID }}" data-reaction="1" aria-pressed="{{ if eq .UserReaction 1 }}true{{ else }}false{{ end }}" title="Like">
        <span class="reaction-icon" aria-hidden="true"></span>
        <span class="reaction-count">{{ .PostReactions.Like }}</span>
      </button>
      <button type="button" class="post-card-action reaction-button dislike-button{{ if eq .UserReaction -1 }} disliked{{ end }}" data-post-id="{{ .PostID }}" data-reaction="-1" aria-pressed="{{ if eq .UserReaction -1 }}true{{ else }}false{{ end }}" title="Dislike">
        <span class="reaction-icon" aria-hidden="true"></span>
        <span class="reaction-count">{{ .PostReactions.Dislike }}</span>
      </button>
      <a class="post-card-action post-comments-link" href="/posts/{{ .PostID }}">
        <svg class="post-comments-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path d="M2 2.75A1.75 1.75 0 0 1 3.75 1h8.5A1.75 1.75 0 0 1 14 2.75v6.5A1.75 1.75 0 0 1 12.25 11H7l-3.5 3v-3.25A1.75 1.75 0 0 1 2 9.25z" />
        </svg>
        {{ .CommentCount }}
      </a>
    </div>
    <span class="reaction-status" role="status" aria-live="polite"></span>
  </div>
</article>
<div id="edit-post-modal-{{ .PostID }}" class="modal" hidden>
  <div class="modal-content">
    <button type="button" class="close-modal"
            onclick="closeModal('edit-post-modal-{{ .PostID }}')" aria-label="Close">&times;</button>
    <h2>Edit post</h2>
    <form method="POST" action="/posts/{{ .PostID }}/update" data-confirm="Are you sure you want save the changes?">
      <div class="form-group">
        <label for="edit-title-{{ .PostID }}">TITLE</label>
        <input id="edit-title-{{ .PostID }}" type="text" name="title" value="{{ .Title }}" required />
      </div>
      <div class="form-group">
        <label for="edit-content-{{ .PostID }}">CONTENT</label>
        <textarea id="edit-content-{{ .PostID }}" name="content" rows="8" required>{{ .Content }}</textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary"
                onclick="closeModal('edit-post-modal-{{ .PostID }}')">Cancel</button>
        <button type="submit" class="login-button">Save changes</button>
      </div>
    </form>
  </div>
</div>
{{ end }}
