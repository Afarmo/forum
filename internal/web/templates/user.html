{{define "user"}}
<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ .Title }}</title>
    <link rel="stylesheet" href="/static/css/style.css?v=signin-neumorphic" />
  </head>
  <body>
    <div class="page-header">
      {{ template "header" .}} {{ template "login-modal" . }} {{ template
      "register-modal" . }}
    </div>
    <div class="page-body">
      {{ template "sidebar" . }}
      <main class="main-content">{{template "profile" .}}</main>
    </div>

    {{ template "confirm-modal" . }}

    <footer class="site-footer">
      Made with ❤️ by Abde, Asha, Yeab, and Liv
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
    <script src="/static/js/main.js?v=confirm-modal"></script>
    <script src="/static/js/cylinder-scroll.js?v=vertical-cylinder-category-order"></script>
    <script src="/static/js/auto-rotation.js?v=vertical-cylinder-stop-at-end"></script>
  </body>
</html>
{{ end }}
