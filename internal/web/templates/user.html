{{define "user"}}
<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ .Title }} | Literary Lions</title>
    <link rel="icon" type="image/x-icon" href="/static/img/favicon.png"/> 
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Poppins:wght@400;500;600;700&display=swap"
    />
    {{ template "stylesheets" }}
  </head>
  <body
    data-authenticated="{{ if .User }}true{{ else }}false{{ end }}"
    data-own-profile="{{ if and .User (eq .User.ID .ProfileUser.ID) }}true{{ else }}false{{ end }}"
    data-profile-picture-notification="{{ .ProfilePictureNotification }}"
  >
    <div class="page-header">
      {{ template "header" .}} {{ template "register-modal" . }}
    </div>
    <div class="page-body">
      {{ template "sidebar" . }}
      <main class="main-content">{{template "profile" .}}</main>
    </div>

    {{ template "confirm-modal" . }}

    {{ template "footer" . }}

    <script src="/static/js/main.js?v=post-options"></script>
    <script src="/static/js/cylinder-scroll.js?v=speed-limit"></script>
  </body>
</html>
{{ end }}
