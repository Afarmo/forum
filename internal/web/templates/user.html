{{define "user"}}
<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ .Title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Poppins:wght@400;500;600;700&display=swap"
    />
    {{ template "stylesheets" }}
  </head>
  <body>
    <div class="page-header">
      {{ template "header" .}} {{ template "login-modal" . }} {{ template
      "register-modal" . }}
    </div>
    <div class="page-body">
      {{ template "sidebar" . }}
      <main class="main-content">{{template "profile" .}}</main>
    </div>

    {{ template "confirm-modal" . }}

    {{ template "footer" . }}

    <script src="/static/js/main.js?v=post-options"></script>
    <script src="/static/js/cylinder-scroll.js?v=speed-limit"></script>
  </body>
</html>
{{ end }}
