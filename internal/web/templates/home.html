{{define "home"}}
<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ .Title }}</title>
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body
    data-authenticated="{{ if .User }}true{{ else }}false{{ end }}"
    data-login-error="{{ .LoginError }}"
    data-register-error="{{ .RegisterError }}"
    data-login-success="{{ .LoginSuccess }}"
  >
    <div class="page-header">
      {{ template "header" .}} {{ template "register-modal" . }}
    </div>
    <div class="page-body">
      {{ template "sidebar" . }}
      <main class="main-content">{{template "home-content" .}}</main>
    </div>

    <footer class="site-footer">
      Made with ❤️ by Abde, Asha, Yeab, and Liv
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
    <script src="/static/js/main.js"></script>
  </body>
</html>
{{ end }}
