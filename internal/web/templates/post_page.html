<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ .Title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Poppins:wght@400;500;600;700&display=swap"
    />
    {{ template "stylesheets" }}
  </head>
  <body
    class="post-page-body"
    data-authenticated="{{ if .User }}true{{ else }}false{{ end }}"
  >
    <div class="page-header">
      {{ template "header" . }} {{ template "register-modal" . }}
    </div>

    <main>{{ template "post-content" . }}</main>
    {{ template "confirm-modal" . }} {{ template "footer" . }}

    <script src="/static/js/main.js"></script>
  </body>
</html>
